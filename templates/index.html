<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>物品位置助手</title>
  <style>
    body {
      font-family: "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background-color: #fff;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user-message {
      background-color: #d1e7dd;
      align-self: flex-end;
      margin-left: auto;
      border-bottom-right-radius: 0;
    }

    .bot-message {
      background-color: #ffffff;
      align-self: flex-start;
      margin-right: auto;
      border: 1px solid #ddd;
      border-bottom-left-radius: 0;
    }

    .input-area {
      display: flex;
      align-items: center;
      padding: 10px;
      border-top: 1px solid #ccc;
      background-color: #fff;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 16px;
    }

    button {
      margin-left: 10px;
      padding: 10px 16px;
      border: none;
      border-radius: 20px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #voice-btn.recording {
      background-color: #f44336;
    }

    .timestamp {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
    }

  </style>
</head>
<body>
  <div class="chat-container">
    <div style="padding: 10px; background-color: #e9f5ec; border-bottom: 1px solid #ccc;">
      <button id="scene-btn" style="padding: 6px 12px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer;">
        📋 查看当前场景信息
      </button>
    </div>
    <div class="chat-box" id="chat-box">
      <!-- 对话消息展示区 -->
    </div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="请输入文字..." />
      <button onclick="sendText()">发送</button>
      <button id="voice-btn" onmousedown="startRecording()" onmouseup="stopRecording()">🎙️ 按住说话</button>
    </div>
  </div>

  
  <script>
    document.getElementById("scene-btn").addEventListener("click", async function () {
      addMessage("📋 正在获取当前场景信息...", true);

      const res = await fetch("/scene");
      const data = await res.json();

      if (data.type === "scene") {
        addMessage(data.scene_info);
      } else {
        addMessage("❌ 无法获取场景信息，请稍后再试");
      }
    });
    const chatBox = document.getElementById("chat-box");

    function addMessage(content, isUser = false) {
      const msg = document.createElement("div");
      msg.className = "message " + (isUser ? "user-message" : "bot-message");
      
      // 加入头像
      const avatar = document.createElement("div");
      avatar.className = "avatar " + (isUser ? "user-avatar" : "bot-avatar");

      // 加入时间戳
      const timestamp = document.createElement("div");
      timestamp.className = "timestamp";
      const now = new Date();
      timestamp.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      msg.textContent = content;
      msg.appendChild(timestamp);
      
      // 拼接头像
      if (isUser) {
        msg.appendChild(avatar);
      } else {
        msg.insertBefore(avatar, msg.firstChild);
      }

      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendText() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = "";

      const res = await fetch("/process", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input: text }),
      });
      const data = await res.json();
      addMessage(data.result);
    }

    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
      const voiceBtn = document.getElementById("voice-btn");
      voiceBtn.classList.add("recording");
      voiceBtn.textContent = "🎙️ 录音中…";

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        audioChunks = [];

        const formData = new FormData();
        formData.append("audio", blob, "recording.webm");

        const tempMsg = document.createElement("div");
        tempMsg.className = "message user-message";
        tempMsg.textContent = "🎧 正在识别语音...";
        chatBox.appendChild(tempMsg);
        chatBox.scrollTop = chatBox.scrollHeight;

        const res = await fetch("/voice", {
          method: "POST",
          body: formData,
        });

        const data = await res.json();

        // 替换内容为识别出的语音原文
        tempMsg.textContent = data.text || "（未能识别）";

        // 接着添加助手回复
        addMessage(data.result);
      };

      mediaRecorder.start();
    }

    function stopRecording() {
      const voiceBtn = document.getElementById("voice-btn");
      voiceBtn.classList.remove("recording");
      voiceBtn.textContent = "🎙️ 按住说话";

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    }

    // 允许回车发送
    document.getElementById("user-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendText();
    });
  </script>
</body>
</html>
